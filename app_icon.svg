<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light blue background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BBDEFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#212121;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="documentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with blue gradient -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#bgGradient)"/>
  
  <!-- Smartphone body - even larger with blue border -->
  <g transform="translate(256, 256) rotate(15)">
    <!-- Phone body with dark blue border -->
    <rect x="-90" y="-145" width="180" height="290" rx="30" ry="30" fill="url(#phoneGradient)" stroke="#1565C0" stroke-width="6" filter="url(#glow)"/>
    
    <!-- Phone screen with light blue background -->
    <rect x="-78" y="-133" width="156" height="234" rx="20" ry="20" fill="#E3F2FD" opacity="0.95"/>
    
    <!-- Screen content -->
    <rect x="-70" y="-125" width="140" height="25" rx="5" ry="5" fill="#1976D2" opacity="0.8"/>
    <rect x="-70" y="-95" width="105" height="12" rx="4" ry="4" fill="#666666" opacity="0.7"/>
    <rect x="-70" y="-78" width="120" height="12" rx="4" ry="4" fill="#666666" opacity="0.7"/>
    <rect x="-70" y="-61" width="90" height="12" rx="4" ry="4" fill="#666666" opacity="0.7"/>
    
    <!-- Home button -->
    <circle cx="0" cy="105" r="15" fill="#1565C0" opacity="0.9"/>
    
    <!-- Earpiece -->
    <rect x="-25" y="-140" width="50" height="5" rx="2.5" ry="2.5" fill="#1565C0" opacity="0.7"/>
  </g>
  
  <!-- Scrolling document -->
  <g transform="translate(256, 180)">
    <!-- Main document -->
    <rect x="-45" y="0" width="90" height="200" rx="8" ry="8" fill="url(#documentGradient)" filter="url(#shadow)"/>
    
    <!-- Document text lines -->
    <rect x="-40" y="10" width="70" height="6" rx="2" ry="2" fill="#666666" opacity="0.7"/>
    <rect x="-40" y="20" width="65" height="6" rx="2" ry="2" fill="#666666" opacity="0.7"/>
    <rect x="-40" y="30" width="75" height="6" rx="2" ry="2" fill="#666666" opacity="0.7"/>
    
    <!-- Document icon/graphic -->
    <circle cx="0" cy="50" r="12" fill="#1976D2" opacity="0.8"/>
    <path d="M -6 -3 L 6 -3 L 6 3 L -6 3 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -4 -1 L 4 -1 L 4 1 L -4 1 Z" fill="#1976D2" opacity="0.8"/>
    
    <!-- More text lines -->
    <rect x="-40" y="70" width="68" height="6" rx="2" ry="2" fill="#666666" opacity="0.6"/>
    <rect x="-40" y="80" width="72" height="6" rx="2" ry="2" fill="#666666" opacity="0.6"/>
    <rect x="-40" y="90" width="60" height="6" rx="2" ry="2" fill="#666666" opacity="0.6"/>
    
    <!-- Scrolling effect lines -->
    <rect x="-40" y="110" width="70" height="4" rx="1" ry="1" fill="#1976D2" opacity="0.5"/>
    <rect x="-40" y="120" width="65" height="4" rx="1" ry="1" fill="#1976D2" opacity="0.4"/>
    <rect x="-40" y="130" width="75" height="4" rx="1" ry="1" fill="#1976D2" opacity="0.3"/>
    <rect x="-40" y="140" width="60" height="4" rx="1" ry="1" fill="#1976D2" opacity="0.2"/>
  </g>
  
</svg>
